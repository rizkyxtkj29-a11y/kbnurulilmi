<!-- Program PAUD/TK: Kesiapan Belajar & Kemandirian -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPAUD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bgPAUD)" />
  
  <!-- Desk & Learning Elements -->
  <g transform="translate(100, 60)">
    <!-- Book -->
    <path d="M50 80 Q100 65 150 80 L150 140 Q100 125 50 140 Z" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
    <path d="M100 72 L100 133" stroke="#0284c7" stroke-width="2" />
    
    <!-- Pencils and Crayons -->
    <rect x="170" y="70" width="16" height="60" rx="3" fill="#f43f5e" />
    <polygon points="170,70 178,50 186,70" fill="#fbbf24" />
    <polygon points="175,58 178,50 181,58" fill="#1e293b" />

    <rect x="195" y="80" width="16" height="50" rx="3" fill="#10b981" />
    <polygon points="195,80 203,60 211,80" fill="#fde68a" />
    <polygon points="200,68 203,60 206,68" fill="#1e293b" />

    <!-- Alphabet & Math Badges -->
    <circle cx="10" cy="50" r="22" fill="#f59e0b" />
    <text x="10" y="58" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">123</text>

    <circle cx="40" cy="10" r="20" fill="#8b5cf6" />
    <text x="40" y="17" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">ABC</text>
  </g>

  <!-- Stars -->
  <polygon points="50,40 54,52 66,52 56,60 60,72 50,64 40,72 44,60 34,52 46,52" fill="#fbbf24" />
  <polygon points="340,80 343,90 353,90 345,96 348,106 340,100 332,106 335,96 327,90 337,90" fill="#fbbf24" />

  <text x="200" y="255" font-family="'Fredoka', sans-serif" font-size="18" font-weight="600" fill="#1e40af" text-anchor="middle">Usia 4 - 6 Tahun (Kesiapan Masuk SD)</text>
</svg>
