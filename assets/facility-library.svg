<!-- Facility: Pojok Baca & Dongeng Anak -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bgLib)" />

  <!-- Bookshelf -->
  <g transform="translate(80, 40)">
    <rect x="0" y="0" width="240" height="180" rx="8" fill="#d97706" />
    <rect x="10" y="10" width="220" height="45" fill="#fef3c7" />
    <rect x="10" y="65" width="220" height="45" fill="#fef3c7" />
    <rect x="10" y="120" width="220" height="50" fill="#fef3c7" />

    <!-- Books Top Shelf -->
    <rect x="20" y="18" width="18" height="37" rx="3" fill="#ef4444" />
    <rect x="42" y="14" width="22" height="41" rx="3" fill="#3b82f6" />
    <rect x="68" y="20" width="16" height="35" rx="3" fill="#10b981" />
    <rect x="88" y="16" width="20" height="39" rx="3" fill="#f59e0b" />
    <rect x="112" y="18" width="24" height="37" rx="3" fill="#8b5cf6" />
    <rect x="140" y="22" width="18" height="33" rx="3" fill="#ec4899" />

    <!-- Books Middle Shelf -->
    <rect x="25" y="72" width="26" height="38" rx="3" fill="#06b6d4" />
    <rect x="55" y="68" width="20" height="42" rx="3" fill="#eab308" />
    <rect x="80" y="74" width="18" height="36" rx="3" fill="#f43f5e" />
    <!-- Stack of Books lying horizontal -->
    <rect x="130" y="94" width="55" height="14" rx="2" fill="#6366f1" />
    <rect x="135" y="80" width="48" height="14" rx="2" fill="#10b981" />

    <!-- Toy on Bottom Shelf -->
    <circle cx="60" cy="145" r="16" fill="#f59e0b" />
    <circle cx="50" cy="135" r="6" fill="#f59e0b" />
    <circle cx="70" cy="135" r="6" fill="#f59e0b" />
    <circle cx="150" cy="145" r="18" fill="#ec4899" />
  </g>

  <text x="200" y="265" font-family="'Fredoka', sans-serif" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">Pojok Baca &amp; Cerita Bergambar Edukatif</text>
</svg>
