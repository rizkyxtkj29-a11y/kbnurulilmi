<!-- Facility: Ruang Kelas Ceria -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bgClass)" />

  <!-- Whiteboard on Wall -->
  <rect x="70" y="30" width="260" height="110" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="4" />
  <rect x="180" y="136" width="40" height="8" rx="2" fill="#cbd5e1" />
  <!-- Writing on Board -->
  <text x="200" y="65" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#0284c7" text-anchor="middle">Mari Belajar &amp; Tersenyum</text>
  <!-- Shapes drawing on Board -->
  <circle cx="130" cy="95" r="14" fill="#fbbf24" />
  <rect x="175" y="82" width="26" height="26" rx="4" fill="#f43f5e" />
  <polygon points="245,82 230,108 260,108" fill="#10b981" />

  <!-- Colorful Round Table for Group Learning -->
  <ellipse cx="200" cy="200" rx="110" ry="35" fill="#f59e0b" />
  <ellipse cx="200" cy="195" rx="105" ry="32" fill="#fbbf24" />
  <!-- Table Legs -->
  <rect x="130" y="200" width="12" height="40" rx="4" fill="#d97706" />
  <rect x="258" y="200" width="12" height="40" rx="4" fill="#d97706" />

  <!-- Colorful Chairs around table -->
  <circle cx="90" cy="190" r="18" fill="#38bdf8" />
  <circle cx="310" cy="190" r="18" fill="#ec4899" />
  <circle cx="200" cy="240" r="18" fill="#34d399" />

  <text x="200" y="265" font-family="'Fredoka', sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="middle">Ruang Kelas Nyaman, Bersih &amp; Ceria</text>
</svg>
