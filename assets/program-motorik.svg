<!-- Program Motorik & Seni Kreativitas -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMotorik" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bgMotorik)" />

  <!-- Painter's Palette -->
  <g transform="translate(100, 50)">
    <path d="M50 80 C40 30, 150 20, 170 70 C190 120, 150 160, 100 150 C70 145, 60 110, 50 80 Z" fill="#ffffff" stroke="#e11d48" stroke-width="3" />
    <circle cx="140" cy="120" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="2" />
    
    <!-- Paint Blobs -->
    <circle cx="85" cy="65" r="12" fill="#ef4444" />
    <circle cx="115" cy="55" r="12" fill="#f59e0b" />
    <circle cx="145" cy="70" r="12" fill="#10b981" />
    <circle cx="95" cy="100" r="12" fill="#3b82f6" />
    <circle cx="80" cy="130" r="10" fill="#a855f7" />

    <!-- Paint Brush -->
    <g transform="rotate(40 180 80)">
      <rect x="170" y="20" width="14" height="120" rx="6" fill="#b45309" />
      <rect x="168" y="10" width="18" height="20" rx="3" fill="#94a3b8" />
      <path d="M168 10 Q177 -5 186 10 Z" fill="#ef4444" />
    </g>
  </g>

  <!-- Colorful Handprints -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="14" fill="#06b6d4" opacity="0.8" />
    <circle cx="8" cy="2" r="5" fill="#06b6d4" />
    <circle cx="16" cy="-4" r="5" fill="#06b6d4" />
    <circle cx="26" cy="-3" r="5" fill="#06b6d4" />
    <circle cx="34" cy="5" r="5" fill="#06b6d4" />
    <circle cx="5" cy="14" r="5" fill="#06b6d4" />
  </g>

  <g transform="translate(320, 120)">
    <circle cx="20" cy="20" r="14" fill="#ec4899" opacity="0.8" />
    <circle cx="8" cy="2" r="5" fill="#ec4899" />
    <circle cx="16" cy="-4" r="5" fill="#ec4899" />
    <circle cx="26" cy="-3" r="5" fill="#ec4899" />
    <circle cx="34" cy="5" r="5" fill="#ec4899" />
    <circle cx="5" cy="14" r="5" fill="#ec4899" />
  </g>

  <text x="200" y="255" font-family="'Fredoka', sans-serif" font-size="18" font-weight="600" fill="#9f1239" text-anchor="middle">Kreasi Seni, Melukis &amp; Stimulasi Motorik</text>
</svg>
