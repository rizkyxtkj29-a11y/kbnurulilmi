<!-- Program KB: Kelompok Bermain -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bgKB)" />
  
  <!-- Cloud & Rainbow -->
  <path d="M40 70 Q60 40 90 60 Q120 40 140 70 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M260 60 Q280 30 310 50 Q340 30 360 60 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="340" cy="50" r="24" fill="#fbbf24" opacity="0.5"/>

  <!-- Building Blocks -->
  <g transform="translate(110, 100)">
    <!-- Block A Red -->
    <rect x="20" y="70" width="60" height="60" rx="8" fill="#f43f5e" />
    <text x="50" y="112" font-family="'Fredoka', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    
    <!-- Block B Blue -->
    <rect x="90" y="70" width="60" height="60" rx="8" fill="#0284c7" />
    <text x="120" y="112" font-family="'Fredoka', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>

    <!-- Block C Yellow on Top -->
    <rect x="55" y="0" width="60" height="60" rx="8" fill="#f59e0b" />
    <text x="85" y="42" font-family="'Fredoka', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  </g>

  <!-- Teddy Bear & Ball -->
  <circle cx="80" cy="200" r="28" fill="#10b981" />
  <path d="M60 200 Q80 180 100 200" stroke="#ffffff" stroke-width="4" fill="none" />
  <circle cx="310" cy="180" r="30" fill="#f43f5e" />
  <circle cx="300" cy="165" r="10" fill="#8b5cf6" />
  <circle cx="325" cy="195" r="8" fill="#f59e0b" />

  <text x="200" y="255" font-family="'Fredoka', sans-serif" font-size="18" font-weight="600" fill="#92400e" text-anchor="middle">Usia 2 - 4 Tahun (Bermain &amp; Sosialisasi)</text>
</svg>
